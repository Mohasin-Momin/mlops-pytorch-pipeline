apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-pvc
  namespace: ml-training
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: checkpoints-pvc
  namespace: ml-training
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: train-classifier
  namespace: ml-training
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: train-classifier
    spec:
      restartPolicy: Never
      containers:
        - name: trainer
          image: mlops-train:v1
          imagePullPolicy: IfNotPresent
          env:
            - name: TRAINING_CONFIG
              value: /app/configs/training_config.yaml
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: config
              mountPath: /app/configs
            - name: data
              mountPath: /app/data
            - name: checkpoints
              mountPath: /app/checkpoints
      volumes:
        - name: config
          configMap:
            name: training-config
        - name: data
          persistentVolumeClaim:
            claimName: data-pvc
        - name: checkpoints
          persistentVolumeClaim:
            claimName: checkpoints-pvc
